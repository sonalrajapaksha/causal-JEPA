[project]
name = "causal-jepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sonalrajapaksha", email = "265506004+sonalrajapaksha@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.1.0.95",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.optional-dependencies]
generation = ["pytorch-lightning", "seaborn", "Pillow"]
